<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Train Station Parallax</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="parallax" id="parallax">
    <div class="parallax__stage">
      <img class="layer" data-speed="0.1"  src="assets/background.svg" alt="" />
      <img class="layer" data-speed="0.25" src="assets/mountains.svg" alt="" />
      <img class="layer" data-speed="0.45" src="assets/houses.svg" alt="" />
      <img class="layer" data-speed="0.65" src="assets/train.svg" alt="" />
      <img class="layer" data-speed="0.9"  src="assets/foreground.svg" alt="" />

      <div class="titlecard">
        <h1>Union Station</h1>
        <p>scroll down</p>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
