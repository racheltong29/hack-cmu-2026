<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Train Station Parallax</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="parallax" id="parallax">
    <div class="parallax__stage">
      <img class="layer" data-speed="0.005"  data-offset="0"    src="assets/background.png" alt="" />
      <img class="layer" data-speed="0.05" data-offset="0.05" src="assets/mountains.png" alt="" />
      <img class="layer" data-speed="0.1" data-offset="0.3" src="assets/houses.png" alt="" />
      <img class="layer" data-speed="0.125" data-offset="0.6" src="assets/train.png" alt="" />
      <img class="layer" data-speed="0.2"  data-offset="0.3" src="assets/foreground.png" alt="" />
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
