[project]
name = "edgar-analyst"
version = "0.1.0"
description = "Multi-agent RAG over SEC filings with hybrid retrieval, citation verification, and an eval harness"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
pg = ["psycopg[binary]>=3.1", "pgvector>=0.2.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
